[package]
name = "oxideav-webp-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone sub-package owned by cargo-fuzz. The `[workspace]` block
# below makes it its own one-member workspace so the umbrella
# `members = ["crates/*"]` glob does not try to build the libFuzzer
# harnesses (libfuzzer-sys requires nightly + a `-C passes=sancov`
# rustc the umbrella stable build does not configure).
[workspace]

[package.metadata]
cargo-fuzz = true

# The §2 RIFF + §2.6 VP8L lossless bitstream + §2.7 VP8X / ALPH / ANIM /
# ANMF extended-container framing parsed by `oxideav_webp::decode_webp`
# is a layered walk: outer RIFF chunk loop, §2.7.1 feature-flag octet,
# per-chunk header validation, §3 VP8L image-header + prefix-coded
# entropy stream, §4 transform stack. Every byte along that path comes
# from an attacker-controlled file. Two of the nine harnesses below
# feed arbitrary bytes straight into the public single-shot entry points
# (`decode_webp` and `extract_metadata`) and assert the only contract is
# "always returns a `Result`" — no panic, no debug-build
# integer overflow, no out-of-bounds index, no allocation sized by a
# header field the limits did not bound. The third harness is a
# round-trip oracle on the still-image lossless encode path:
# fuzz-controlled RGBA bytes + dimensions go through
# `encode_webp_lossless`; the output bytes are decoded through
# `decode_webp`; pixel-for-pixel equality is asserted. The fourth
# harness widens that round-trip oracle across the §2.7.1.1 animation
# layer: a fuzz-controlled 1..8-frame animation built by
# `build_animated_webp` is decoded back through `decode_webp` and the
# frame count + per-frame dimensions + per-frame duration + per-frame
# pixels are asserted byte-identical. The fifth harness drives the
# §2.7.1.2 ALPH standalone entry point `alph::decode_alpha` directly:
# fuzz-controlled `(width, height)` ∈ [1, 64]² with a fuzz-controlled
# ALPH chunk payload (info byte + alpha bitstream) batters the four
# §2.7.1.2 filter methods (none / horizontal / vertical / gradient)
# and the two compression methods (raw + headerless §3 VP8L) the
# function dispatches between, with `plane.len() == width * height`
# asserted on success per the §2.7.1.2 carrier-field invariant. The
# sixth harness drives the §2.7.1 VP8X chunk parser standalone entry
# point `vp8x::Vp8xHeader::parse` directly: an arbitrary fuzz buffer
# is forwarded verbatim as the §2.7.1 VP8X payload candidate, with
# every successfully-decoded field cross-checked against the bytes
# the parser observed (canvas-dimension bounds in [1, 2^24] + product
# cap ≤ 2^32 - 1 + bit-by-bit flag-octet decode against the §2.7.1
# Figure 7 I/L/E/X/A/R/Rsv positions + reserved-bit `has_unknown`
# summary), and every error branch cross-checked against the §2.7.1
# refusal triggers (BadPayloadLength.got equals the slice length and
# is not 10; CanvasTooLarge implies the cross-checked product strictly
# exceeded 2^32 - 1). The seventh harness drives the §2.7.1.1 ANMF
# chunk header parser standalone entry point `anmf::AnmfHeader::parse`
# directly: an arbitrary fuzz buffer is forwarded verbatim as the
# §2.7.1.1 ANMF payload candidate, with every successfully-decoded
# field cross-checked against the bytes the parser observed (the
# `Frame X * 2` doubling, the `Frame W/H Minus One + 1` resolution,
# the literal uint24 duration, the info-byte Reserved / B / D
# extraction at bits 7..2 / 1 / 0, and the fixed `frame_data_offset
# == 16`), and the `PayloadTooShort` branch cross-checked against the
# §2.7.1.1 16-byte minimum (got equals the slice length and is < 16).
# The eighth harness drives the §2.7.1.1 ANIM chunk parser standalone
# entry point `anim::AnimHeader::parse` directly: an arbitrary fuzz
# buffer is forwarded verbatim as the §2.7.1.1 ANIM payload candidate,
# with every successfully-decoded field cross-checked against the bytes
# the parser observed (BGRA byte-order of `Background Color` at bytes
# 0..4 with the `as_u32_le` helper matching the little-endian `u32`
# reload, `Loop Count` as the little-endian `u16` at bytes 4..6, and
# the `loops_forever()` predicate matching `loop_count == 0`), and the
# `BadPayloadLength` branch cross-checked against the §2.7.1.1
# Figure 8 fixed 6-byte length (got equals the slice length and is
# not 6). The ninth harness drives the §2.7.1.2 ALPH info-byte parser
# standalone entry point `alph::AlphHeader::parse` directly: an
# arbitrary fuzz buffer is forwarded verbatim as the §2.7.1.2 ALPH
# payload candidate, with every successfully-decoded field
# cross-checked against the bytes the parser observed (the MSB-first
# `Rsv|P|F|C` 2-bit field decomposition of the info byte at bits 7..6
# / 5..4 / 3..2 / 1..0, the `info_byte` raw echo of `payload[0]`, the
# typed-variant mapping for the `C` / `F` / `P` enums including the
# `Reserved(_)` variants for the undefined 2 / 3 values §2.7.1.2
# leaves unnamed, and the fixed `bitstream_offset == 1`), and the
# `EmptyPayload` branch cross-checked against the §2.7.1.2 requirement
# that at minimum one info byte be present (raised iff the payload
# slice is empty). Round-trip exactness is the §3 lossless contract;
# preservation of the §2.7.1.1 carrier fields is the ANIM / ANMF chunk
# contract; the §2.7.1.2 ALPH plane length is the ALPH chunk contract;
# the §2.7.1 VP8X field-by-field redecode is the §2.7.1 Figure 7
# byte-layout contract; the §2.7.1.1 ANMF field-by-field redecode is
# the §2.7.1.1 Figure 9 byte-layout contract; the §2.7.1.1 ANIM
# field-by-field redecode is the §2.7.1.1 Figure 8 byte-layout
# contract; the §2.7.1.2 ALPH info-byte field-by-field redecode is
# the §2.7.1.2 Figure 10 bitfield contract; the §4 VP8L
# transform-list field-by-field redecode is the §4
# transform-presence loop contract. The tenth harness drives the
# §4 VP8L transform-list reader standalone entry point
# `vp8l_stream::TransformList::read` directly: an arbitrary fuzz
# buffer feeds a zero-positioned `BitReader` (no §3 image-header
# skip), with every successfully-decoded list cross-checked against
# the §4 carrier rules (`transforms().len() <= 4`, no repeated
# `TransformType`, §4.1 / §4.2 `size_bits ∈ [2, 9]`, §4.4
# `color_table_size ∈ [1, 256]` plus the threshold-table `width_bits`
# derivation, `body_bit_position` within the slice's bit length,
# `stopped_at_entropy_body` consistent with the last entry's
# `has_entropy_body()`), and every refusal branch cross-checked
# against the §4 trigger (BitReaderEof's `bit_pos + available`
# in-range with `wanted > available`; DuplicateTransform's variant
# being one of the four §4 `TransformType` values). The eleventh
# harness drives the §5.2.3 color-cache info + §6.2.2 meta-prefix +
# §6.2 5-prefix-code-group reader standalone entry point
# `meta_prefix::MetaPrefixHeader::read` directly: an arbitrary fuzz
# buffer feeds a zero-positioned `BitReader` (no §3 image-header skip),
# with the §6.2.2 `ImageRole` and the entropy-image dimension inputs
# both fuzz-derived. Every successfully-decoded header is cross-checked
# against the §5.2.3 + §6.2.2 carrier rules (`code_bits` is `0` or in
# `[1, 11]`, `is_enabled()` matches `code_bits != 0`, `size()` is `0` /
# `1 << code_bits`, the `EntropyCoded` role never reaches
# `EntropyImagePending`, the `EntropyImagePending` branch's
# `prefix_bits` is in `[2, 9]` with `image_width` / `image_height`
# matching the §6.2.2 `DIV_ROUND_UP(caller_dim, 1 << prefix_bits)`
# derivation and `entropy_image_bit_position` within the slice's bit
# length); every refusal branch is cross-checked against the trigger
# (BitReaderEof's `bit_pos + available` in-range with
# `wanted > available`; InvalidColorCacheCodeBits's `value` being `0`
# or above the `[1, 11]` window; Prefix surfacing the §6.2.1 refusal
# cleanly). The twelfth harness drives the §2.3 / §2.4 RIFF/WEBP
# chunk-walker standalone entry point `container::parse` directly:
# every byte of an arbitrary fuzz buffer is forwarded verbatim as a
# candidate `RIFF/WEBP` file with attacker-controlled chunk-`Size`
# fields, with every successfully-decoded chunk cross-checked against
# the bytes the walker observed (FourCC at `buf[header_offset..+4]`,
# LE uint32 `Size` at `buf[header_offset + 4..+8]`, `payload_end -
# payload_start == size as usize`, `payload_end` inside both the
# buffer length and the §2.4 declared RIFF window, on-disk order with
# `chunks[i+1].header_offset == chunks[i].payload_end + (size & 1)`,
# the `is_extended()` / `is_vp8_lossy()` / `is_vp8_lossless()`
# predicates pure functions of FourCC, and the `chunks_with_fourcc`
# / `first_chunk_with_fourcc` helpers matching a manual filter), and
# every error variant cross-checked against the §2.3 / §2.4 refusal
# trigger (TooShortForHeader.got == buf.len() < 12; NotRiff.got
# == buf[0..4] != 'RIFF'; NotWebp.got == buf[8..12] != 'WEBP' with
# buf[0..4] == 'RIFF'; RiffSizeOverflowsBuffer.declared ==
# LE uint32 at buf[4..8] with 8 + declared > buffer_len;
# TruncatedChunkHeader.offset >= 12 inside declared window with
# < 8 bytes remaining; ChunkPayloadOverflowsRiff.offset >= 12 with
# 8-byte header fitting, declared == LE uint32 at chunk header,
# available == declared_end - (offset + 8), declared > available;
# MissingPadByte.offset >= 12 with declared Size odd, payload itself
# fitting, and pad byte at payload_end + 1 outside declared window).
# The thirteenth harness drives the §5.2.2 distance-code-to-pixel-
# distance pure-function lookup standalone entry point
# `vp8l_decode::distance_code_to_pixel_distance` directly: every byte
# of an arbitrary fuzz buffer is forwarded verbatim as a series of
# `(image_width, distance_code)` u32 LE pairs (the first 4 bytes
# masked to the §3.4 14-bit image-width ceiling, every subsequent
# 4-byte word floored at 1 to honour the §5.2.2 wire-encoded
# `distance_code >= 1` precondition), with every returned `D` cross-
# checked against the §5.2.2 spec formula (`D == max(1, xi + yi *
# image_width)` for codes `1..=120` via the 120-entry `DISTANCE_MAP`,
# `D == distance_code - 120` for codes `> 120`) and the §5.2.2 clamp
# guarantee (`D >= 1` always — either from the §5.2.2 clamp on the
# neighborhood-lookup branch or from the smallest reachable raw scan-
# line distance of `121 - 120 = 1` on the reservation branch); also
# pure-function determinism asserted by calling the lookup twice and
# checking the two results are equal. The fourteenth harness drives
# the §5.2.3 lossless-color-cache primitives standalone entry point
# `vp8l_decode::ColorCache` directly: the first fuzz byte fixes the
# §5.2.3 `code_bits` (remapped into the [1, 11] permitted window per
# the §5.2.3 "compliant decoders MUST indicate a corrupted bitstream
# for other values" rule), every subsequent 4-byte word is forwarded
# verbatim as a fuzz-controlled ARGB color into `ColorCache::insert`,
# with every hash cross-checked against the §5.2.3 spec formula
# `(0x1e35a7bd * argb) >> (32 - code_bits)`, every insert/lookup
# round trip cross-checked against the §5.2.3 single-slot single-write
# spec text ("Only one lookup is done in a color cache; there is no
# conflict resolution"), every per-slot lookup cross-checked against
# a parallel shadow model that records the §5.2.3 most-recently-
# inserted-wins overwrite behaviour, the §5.2.3 cache initialization
# invariant cross-checked on a fresh cache (`size() == 1 << code_bits`,
# every slot reads as `Some(0)`, `lookup(size())` reads as `None`),
# `lookup(usize::MAX)` cross-checked as `None`, and pure-function
# determinism asserted on the insert sequence by rebuilding a replay
# cache from the same fuzz bytes and verifying every slot agrees with
# the primary cache. The fifteenth harness drives the §4.1 inverse
# predictor + §4.2 inverse color in-place transform passes standalone
# entry points `vp8l_transform::inverse_predictor` +
# `vp8l_transform::inverse_color` directly: the first three fuzz bytes
# fix the §4.1 / §4.2 `(width, height, size_bits)` carrier triple
# (`width` / `height` masked into [1, 32] for iteration cost, `size_bits`
# remapped into [0, 9] to cover the full §4.1 / §4.2 `ReadBits(3) + 2`
# window plus the size_bits = 0 hoist branch), every subsequent 4-byte
# word is forwarded verbatim as a fuzz-controlled ARGB residual then
# (after `width * height` words) as a fuzz-controlled sub-resolution
# predictor / color image pixel, with the §4.1 left-topmost rule
# cross-checked against the §4.1 spec text (`pred_pixels[0] ==
# residual[0] + 0xff000000` per channel mod 256), the §4.1 1×H
# left-column rule cross-checked against the §4.1 "all pixels on the
# leftmost column are T-pixel" spec text (every `(0, y)` equals
# `residual + T` per channel mod 256), the §4.1 W×1 top-row rule
# cross-checked against the §4.1 "all pixels on the top row are
# L-pixel" spec text (every `(x, 0)` equals `residual + L` per channel
# mod 256), the §4.2 alpha-and-green preservation invariant
# cross-checked against the §4.2 spec text ("The alpha and green
# channels are left as is"), the §4.2 zero-CTE no-op invariant
# cross-checked by re-running the pass against an all-zero
# sub-resolution image (every per-pixel output equals the input), the
# §4.2 per-block constancy invariant cross-checked against the §4.2
# block structure (two same-block pixels with equal pre-pass RGB
# produce equal post-pass red + blue), and both passes' early-return
# contract cross-checked against the §4.1 / §4.2 `(width == 0 ||
# height == 0)` no-op (the pixel buffer is byte-identical to the
# pre-call snapshot). The sixteenth harness drives the §4.3
# inverse-subtract-green + §4.4 inverse-color-table + §4.4
# inverse-color-indexing transform passes standalone entry points
# `vp8l_transform::{inverse_subtract_green, inverse_color_table,
# inverse_color_indexing}` directly: the first three fuzz bytes fix
# the §4.3 / §4.4 `(orig_width, height, table_size)` carrier triple
# (`orig_width` / `height` masked into [1, 32] for iteration cost,
# `table_size` derived as `data[2] + 1` into the §4.4 wire window
# [1, 256]), every subsequent 4-byte little-endian word is forwarded
# verbatim first as a fuzz-controlled ARGB §4.3 input pixel, then
# (after `width * height` words) as a fuzz-controlled §4.4
# color-table delta entry, then (after `table_size` more words) as a
# fuzz-controlled §4.4 packed-index ARGB pixel — with the §4.3
# alpha-and-green preservation invariant cross-checked against the
# §4.3 spec text (every pixel's alpha + green byte is byte-identical
# to the pre-pass input, every pixel's red byte equals input red +
# input green mod 256, every pixel's blue byte equals input blue +
# input green mod 256), the §4.3 per-pixel locality invariant
# cross-checked by running the pass on every first-8 single-pixel
# input independently and asserting the single-pixel output equals
# the multi-pixel output at the matching position, the §4.3
# zero-green-byte no-op cross-checked against the §4.3 `(red + 0) =
# red, (blue + 0) = blue` reduction, the §4.4 color-table seed
# preservation cross-checked against the §4.4 spec text (`table[0]`
# is left untouched), the §4.4 color-table running-sum invariant
# cross-checked against the §4.4 "adding the previous color component
# values by each ARGB component separately and storing the least
# significant 8 bits of the result" spec text (every `i >= 1` entry
# is the per-channel running sum mod 256 of the original input bytes),
# the §4.4 color-table determinism cross-checked across replay, the
# §4.4 color-indexing output-length cross-checked against the §4.4
# `orig_width * height` carrier contract, the §4.4 color-indexing
# palette-lookup cross-checked against the §4.4 spec formula (output
# `(x, y)` is `color_table[((packed_green >> ((x % count) * bits)) &
# mask) as usize]` with `width_bits` derived from the table size via
# the §4.4 threshold table, falling back to transparent black
# `0x00000000` when the index is out of range), the §4.4
# color-indexing determinism cross-checked across replay, and the
# §4.4 color-indexing empty-table edge case cross-checked against the
# §4.4 "unused indices map to transparent black" rule (every output
# pixel is `0x00000000` when the table is zero-length). The §4.3
# empty-buffer and §4.4 single-element-table degenerate no-op
# branches are cross-checked unconditionally on every iteration. The
# seventeenth harness drives the §5.2.2 backward-reference assembler
# standalone entry point `vp8l_decode::apply_backward_reference`
# directly: the fuzz buffer fixes a `(prefill_len, length, dist,
# total_pixels)` carrier tuple (prefill_len masked to [0, 4096];
# total_pixels alternated between `prefill_len + length + headroom`
# and a shrunk value below `prefill_len + length` so both the
# success / exact-fit path and the §5.2.2 overflow refusal are
# routinely reached) plus a stream of fuzz-controlled ARGB pre-fill
# pixels, with every Ok outcome cross-checked against the §5.2.2 copy
# contract (the returned range equals `position..position + length`,
# exactly `length` pixels are appended, the already-decoded prefix is
# byte-identical, and every appended pixel matches a parallel
# reference LZ77 walk `out[position + i] == out[position + i - dist]`
# read after the preceding writes — the overlapping `dist < length`
# self-repeat included), the §5.2.2 underflow refusal cross-checked
# against its trigger (`dist > position`, fields echo the call,
# buffer byte-identical to its pre-call snapshot), the §5.2.2
# overflow refusal cross-checked against its trigger (`position +
# length > total_pixels` with the underflow guard having passed,
# fields echo the call, buffer byte-identical), and pure-function
# determinism cross-checked by replaying a successful run from the
# same pre-fill and asserting an identical buffer + range. The
# eighteenth harness drives the §6.2.2 meta-prefix block-lookup table
# standalone constructor + selector entry points
# `vp8l_decode::MetaPrefixIndex::{from_parts, meta_code_for}` directly:
# the first three fuzz bytes fix a `(prefix_bits, block_width,
# block_height)` carrier triple (prefix_bits masked to [0, 15] so the
# §6.2.2 [2, 9] window and its rejection are both reached; the grid
# masked into [0, 32]² with 0 reaching the degenerate-grid refusal), a
# skew byte shifts the supplied code count off `block_width *
# block_height` by [-2, +2], and the remaining 2-byte LE words supply
# the meta-prefix codes verbatim, with every Ok index cross-checked
# against the §6.2.2 carrier rules (accessors echo the parts,
# `num_prefix_groups() == max(entropy image) + 1`, and `meta_code_for`
# at all four corners of every block's `(1 << prefix_bits)`-pixel-square
# covered area matching the §6.2.2 position formula), every error
# variant cross-checked against its §6.2.2 refusal trigger in
# precedence order (`InvalidPrefixBits` ⇔ prefix_bits ∉ [2, 9];
# `EmptyIndex` ⇔ zero-block grid with the prefix-bits gate passed;
# `CodeCountMismatch` ⇔ count off the expectation with both earlier
# gates passed), and constructor determinism cross-checked by
# rebuilding from the same parts plus round-tripping the index's own
# accessors back through `from_parts`. The nineteenth harness drives
# the §6.2.2 *entropy image* decode path standalone entry point
# `vp8l_decode::decode_entropy_image` directly: the first three fuzz
# bytes fix the `(prefix_bits, prefix_image_width, prefix_image_height)`
# §6.2.2 carrier triple (prefix_bits masked to [0, 15]; the block
# dimensions modulo 9 so the §7.3 sub-image decode stays bounded and 0
# reaches the §6.2.2 degenerate-dimension `EmptyEntropyImage` refusal),
# and the remaining bytes feed a zero-positioned `BitReader` the §7.3
# `entropy-coded-image` bit sequence. Every Ok index is cross-checked
# against the §6.2.2 + §7.3 carrier rules: the accessors echo the
# carrier triple (`prefix_bits()`, `block_width() ==
# prefix_image_width`, `block_height() == prefix_image_height`); §7.3
# carries one meta-code per block (`meta_codes().len() ==
# prefix_image_width * prefix_image_height`); §6.2.2 `num_prefix_groups()
# == max(meta_codes) + 1`; and the §6.2.2 fold (`meta_prefix_code ==
# (entropy_pixel >> 8) & 0xffff`) cross-checked against an independent
# decode of the same bytes through the public sibling
# `decode_entropy_coded_image` — the harness refolds that decode's raw
# ARGB pixels and asserts byte-equality with the meta-codes
# `decode_entropy_image` produced plus both readers advancing to the
# same bit position. The §6.2.2 position-formula round-trip is
# cross-checked by rebuilding the index through `from_parts` from its
# own accessors; determinism by replaying the same bytes + carrier
# triple and asserting an identical index advanced to an identical bit
# position. The §6.2.2 degenerate-dimension refusal is pinned to the
# `EmptyEntropyImage` variant echoing the carrier dimensions iff at
# least one is zero; every other refusal is required only to return a
# `Result` rather than panic (the granular §5.2 / §6.2 refusal modes
# are cross-checked by the sibling `decode` / `parse_meta_prefix`
# harnesses through their own entry points). The twentieth harness
# drives the §7.3 *entropy-coded-image* decode path standalone entry
# point `vp8l_decode::decode_entropy_coded_image` directly — the §7.3
# ABNF building block beneath the round-270 §6.2.2 entropy image (which
# wraps this function and folds its pixels) and the §4.1 / §4.2 / §4.4
# sub-resolution images: the first two fuzz bytes fix the §7.3
# `(width, height)` carrier (each modulo 9 so the §5.2 / §6.2 decode
# loop stays bounded and 0 reaches the §7.3 degenerate-dimension
# `EmptyEntropyImage` refusal), and the remaining bytes feed a
# zero-positioned `BitReader` the §7.3 `entropy-coded-image` bit
# sequence (§5.2.3 color-cache-info bit + one §6.2 prefix-code group +
# §5.2 LZ77 / color-cache data). Every Ok image is cross-checked
# against the §7.3 carrier rules (`width()` / `height()` echo the
# carrier, `pixels().len() == width * height`, the success path
# reachable only with both dimensions ≥ 1, the reader never advancing
# past the slice's bit length) and against the §6.2.2 wrapper
# (`decode_entropy_image` over the same bytes reproduces the
# `(pixel >> 8) & 0xffff` per-pixel fold as its per-block meta-codes
# and advances the reader identically), with pure-function determinism
# cross-checked by replaying the same bytes + dimensions and asserting
# a byte-identical pixel buffer at an identical bit position. The §7.3
# degenerate-dimension refusal is pinned to the `EmptyEntropyImage`
# variant echoing the carrier dimensions iff at least one is zero;
# every other refusal is required only to return a `Result` rather than
# panic (the granular §5.2 / §6.2 refusal modes are cross-checked by
# the sibling `parse_meta_prefix` / `distance_code` / `color_cache` /
# `backward_reference` harnesses through their own entry points). The
# twenty-second harness drives the §4 transform-list + main-image driver
# standalone entry points `vp8l_transform::{decode_lossless,
# decode_lossless_headerless}` directly — the layer immediately above the
# round-272 §6.2.2 `decode_argb`: the first two fuzz bytes fix the §4 /
# §6.2.2 `(width, height)` carrier (each clamped into [1, 8] so the
# success contract holds and the decode stays ≤ 64 pixels), and the
# remaining bytes are the VP8L chunk-payload bits, read by
# `decode_lossless` past the §3.4 5-byte image-header (transform list at
# bit 40) and by `decode_lossless_headerless` from bit 0 (the §2.7.1.2
# ALPH form, no header skip). Each entry point walks the §4 / §7.2
# optional-transform loop (per-transform §4.x fixed fields + §5-encoded
# body via the §7.3 `decode_entropy_coded_image`, the §4 once-each
# refusal, the §4.4 `color_table_size` / `width_bits` width subsampling),
# decodes the main §5.1 ARGB image at the subsampled width, and applies
# the §4 inverse-transform chain in reverse read order ("last one
# first"). Every Ok image is cross-checked against the §4 / §6.2.2
# carrier rules (`width()` / `height()` echo the carrier even after a
# §4.4 color-indexing transform un-bundles the internal width back to the
# canvas width, `pixels().len() == width * height`), with pure-function
# determinism cross-checked by replaying the same bytes + dimensions for a
# byte-identical pixel buffer; every refusal is required only to return a
# `Result` rather than panic (the granular §4 / §5 / §6 refusal modes are
# cross-checked by the sibling `parse_transform_list` /
# `inverse_predictor_color` / `inverse_subtract_green_indexing` /
# `decode_argb` harnesses through their own entry points). The
# twenty-fourth harness is a differential oracle on the §2.7.1.1
# animation *assembly* path `build_animated_webp_with_options` →
# `decode_webp` with every per-frame carrier field fuzz-driven: even
# `(x, y)` sub-canvas offsets, mixed `Auto` / `Delta` / `Lossless`
# frame modes (the dirty-rect sub-frame encoder), `None` / `Background`
# disposal, `Overwrite` / `AlphaBlend` blending, and the `ANIM`
# loop-count + background-colour options. Every decoded full-canvas
# frame snapshot is asserted byte-identical to an independent
# §2.7.1.1 canvas simulation (bg-filled canvas, previous frame's
# dispose applied before each render, per-frame blend formula), and
# duration / loop count / background colour are asserted to carry
# through — a mismatch is a real §2.7.1.1 contract violation in the
# dirty-rect diff, the dispose/blend emission, or the decoder's
# compositor. The twenty-fifth harness is a differential oracle on the
# §2.7 metadata *write* path: the two independent extended-layout
# writers `build::build_webp_file_with_metadata` and
# `encode_vp8l_argb_with_metadata` are driven with fuzz-controlled
# §2.7.1.4 `ICCP` / §2.7.1.5 `EXIF` / `XMP ` payloads (presence,
# length 0..=255 — odd lengths exercising the §2.3 pad byte — and
# content), a fuzz-controlled §2.7.1 `L` alpha-hint flag, and
# fuzz-controlled canvas dimensions + ARGB pixels; every emitted file
# is cross-checked against the §2.7 documented contract (the §2.3 /
# §2.4 walker parses it; the chunk sequence is the canonical `VP8X,
# ICCP?, VP8L, EXIF?, XMP?` order with the §2.7.1.4 "MUST appear
# before the image data" ICCP rule; each metadata chunk's `Size` +
# payload bytes round-trip verbatim; the §2.7.1 flag octet declares
# exactly the supplied features with the canvas dimensions echoed;
# `extract_metadata` and the `decode_webp` metadata carry agree
# byte-for-byte; the lossless pixels survive the metadata-bearing
# layout exactly), the writer-B no-alpha/no-metadata demotion to the
# §2.6 simple single-`VP8L` layout is pinned, and both writers'
# metadata walks are asserted identical to each other. The
# twenty-seventh harness is a differential oracle on the §6.2.1
# read-symbol fast path: the round-284 256-entry primary lookup table
# (plus its > 8-bit continuation walk, near-EOF fallback, and
# used-symbol amortization gate) is run in lockstep against the crate's
# own pre-table per-bit row walk (`PrefixCode::read_symbol_reference`)
# over the same bytes, with the decoded symbol (or typed refusal,
# including the `Eof` position fields), the cursor position after every
# symbol, and the alphabet bound asserted identical — the code under
# test built either off the wire (`PrefixCode::read` at a §6.2.3
# alphabet) or from a fuzz-shaped length table repaired to an exact
# §6.2.1 Kraft sum so the mutator steers the used-symbol count and the
# length profile freely. The twenty-eighth harness re-drives the §4
# transform-list + main-image lossless decode entry points at carrier
# dimensions widened into [1, 64] (≤ 4096 pixels) with its corpus
# seeded from the committed fixture corpus's VP8L chunk payloads, so
# the §6.2.1 lookup-table fast path and the word-load BitReader run hot
# inside the assembled pipeline under adversarial mutation; the
# round-273 carrier/echo/determinism contract is asserted unchanged.

[dependencies]
libfuzzer-sys = "0.4"

# Pulled in with `default-features = false` so the fuzz build exercises
# the framework-free standalone surface (`decode_webp`,
# `extract_metadata`, `encode_webp_lossless`) and never links
# `oxideav-core` — the same shape every other fuzz harness in this
# workspace uses.
[dependencies.oxideav-webp]
path = ".."
default-features = false

