[package]
name = "oxideav-webp"
version = "0.2.1"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav-webp"
authors = ["Mark Karpeles"]
description = "Pure-Rust WebP image codec — orphan-rebuild scaffold pending clean-room re-implementation."

readme = "README.md"
homepage = "https://github.com/OxideAV/oxideav-webp"
keywords = ["multimedia", "image", "webp", "codec", "pure-rust"]
categories = ["multimedia::encoding", "multimedia::images"]

[dependencies]
oxideav-core = { version = "0.1", optional = true }
# VP8 (lossy) bitstream decoder. Pulled in with `default-features = false`
# so it does NOT drag the `oxideav-core` dep tree into the standalone
# (`default-features = false`) build of this crate — only `oxideav-vp8`'s
# own `registry` feature gates that, and we leave it off here. The lossy
# decode + `From<oxideav_vp8::Vp8Error>` adapter are part of the standalone
# surface, so this is a non-optional dependency. vp8 is
# at 0.2 (not 0.1) per the workspace major-bump rule.
oxideav-vp8 = { version = "0.2", default-features = false }

[features]
default = ["registry"]
# When the webp crate's `registry` feature is on, also enable the
# `oxideav-vp8` sibling crate's `registry` feature so its
# `oxideav_core::Encoder` factory (`make_encoder_with_qindex`, etc.) is
# available for `encoder_vp8::make_encoder*` to delegate to. Mirrors the
# published 0.1.2 cascade.
registry = ["dep:oxideav-core", "oxideav-vp8/registry"]
# Opt-in `std::simd` (portable SIMD) acceleration of the hottest pixel-
# repack / inverse-transform loops. Nightly-only because it activates
# `#![feature(portable_simd)]`. Every SIMD code path has a stable
# byte-identical scalar fallback compiled in by default; toggling this
# feature must NEVER change emitted bytes. See `BENCHMARKS.md` for the
# specific loops affected and the measured before/after numbers.
simd = []

[dev-dependencies]
# Round-170 (benchmark + profile dispatch): Criterion drives the
# four bench harnesses (`lossless_encode`, `lossless_decode`,
# `lz77_match`, `argb_to_rgba`) so future webp encoder / decoder
# rounds can A/B their changes. Pinned to the same 0.5 line every
# other OxideAV crate with benches (cinepak / bmp / flac / gif /
# hdr) already tracks.
criterion = "0.5"

# Round-170 benches. Each binary lives in `benches/<name>.rs` and is
# self-contained (no committed fixture files — the benches build the
# input ARGB / RGBA on the fly via the public API or the existing
# `tests/data/` fixtures). Run with:
#     cargo bench -p oxideav-webp --bench <name>
[[bench]]
name = "lossless_encode"
harness = false

[[bench]]
name = "stacked_transform_encode"
harness = false

[[bench]]
name = "lossless_decode"
harness = false

[[bench]]
name = "lz77_match"
harness = false

[[bench]]
name = "argb_to_rgba"
harness = false

[[bench]]
name = "inverse_predictor"
harness = false

[[bench]]
name = "inverse_color"
harness = false

[[bench]]
name = "inverse_color_indexing"
harness = false

[[bench]]
name = "inverse_subtract_green"
harness = false

[[bench]]
name = "predictor_subtract"
harness = false

[[bench]]
name = "apply_subtract_green"
harness = false

[[bench]]
name = "inverse_color_table"
harness = false

[[bench]]
name = "build_code_lengths"
harness = false

[[bench]]
name = "canonical_codes"
harness = false

[[bench]]
name = "read_lz77_value"
harness = false

[[bench]]
name = "color_cache_hash"
harness = false

[[bench]]
name = "value_to_prefix"
harness = false

# Round-276: decoder-side §6.2.1 canonical-table build
# (`PrefixCode::from_code_lengths`) — the decode mirror of the
# round-250/251 `build_code_lengths` / `canonical_codes` benches.
[[bench]]
name = "prefix_from_code_lengths"
harness = false

# Round-281: encoder-side §3.5.2 color-transform-element chooser
# (`pick_block_cte`) full-image block walk — the per-pixel-heavy
# stage of `encode_with_color_transform` (rank 2 in the round-280
# post-change encode profile).
[[bench]]
name = "pick_block_cte"
harness = false

# Round-283: end-to-end decode coverage beyond the single gradient
# fixture — full-file decode per elected §4 transform mix, §2.7.1.1
# animation full-timeline decode (keyframe vs delta layouts), and the
# §2.7 metadata-chunk walk (`extract_metadata`).
[[bench]]
name = "lossless_decode_mixes"
harness = false

[[bench]]
name = "anim_decode"
harness = false

[[bench]]
name = "metadata_walk"
harness = false

# Round-286: decoder-side §6.2.1 `PrefixCode::read_symbol` per-symbol
# canonical-prefix-code reader — the rank-1 decode hotspot (~82% of
# decode self-time post-round-284). Isolates the round-284 primary
# table fast path (codes ≤ 8 bits) from the long-code (> 8-bit) walk
# continuation the round-284 follow-up targets, giving the
# second-level-spill-table candidate direct A/B numbers per regime.
[[bench]]
name = "read_symbol"
harness = false

# Round-286: §5.2.2 LZ77 hash-chain matcher chain-*depth* scenarios
# (`Lz77Matcher::find` + `insert`, rank 3 in the round-283 encode
# profile). Where `lz77_match` uses one repeating tile, these cells
# vary hash-chain depth (period-2/4/64 repeats, unique, gradient) so a
# future chain-walk cut has A/B numbers per depth regime.
[[bench]]
name = "lz77_chain"
harness = false

# Round-291: the §2.7.1.2 `ALPH` (alpha-plane) decode path — the rank-1
# webp-owned cost on the lossy decode path (≈52% of lossy e2e in the
# round-289 map, previously sized only by subtraction). Three altitudes:
# public `decode_alpha_plane` e2e over the committed fixture, `decode_alpha`
# on the extracted `ALPH` payload (RIFF walk removed), and the §2.7.1.2
# Stage-2 inverse-filter loop in isolation per filter method (synthetic
# uncompressed payloads).
[[bench]]
name = "alpha_decode"
harness = false

# Round-289: the §2.5 `VP8 ` (lossy) decode path this crate owns. The
# sibling `oxideav-vp8` decoder does the entropy/IDCT/prediction/loop-
# filter work; this crate's lossy cost is the post-I420 reconstruction —
# `decode_lossy_rgba` → `yuv420_to_rgba` (4:2:0 chroma up-sample + §9.2
# BT.601 YCbCr→RGB). Three altitudes: full public `decode_webp` e2e,
# `decode_lossy_rgba` on the extracted bitstream (no RIFF walk), and the
# `yuv420_to_rgba` conversion loop in isolation at 16/128/256 px.
[[bench]]
name = "lossy_decode"
harness = false

# Round-294: the encoder-side §6.2.2 entropy-image block-clustering
# heuristic (`cluster_blocks_by_histogram_distance`) behind
# `encode_with_meta_prefix`. Coarse-RGB-histogram Lloyd's k-means over
# the `1 << prefix_bits`-aligned blocks: per-pixel feature pass +
# farthest-point seeding + up-to-8-pass assignment/update loop. Three
# altitudes: content regime (bimodal / gradient / uniform-degenerate),
# num_groups sweep (2/3/4), and image-size sweep (128/256/384 px).
[[bench]]
name = "meta_prefix_cluster"
harness = false

# Round-297: decoder-side §5.2.2 `apply_backward_reference` — the LZ77
# copy-back that replays one chosen run into the decoded ARGB buffer
# (`decode_one_symbol`'s length-symbol branch). The `lz77_match` /
# `lz77_chain` benches measure the encoder's chain matcher that *finds* a
# run; the decoder copy-back that *replays* it had no isolated harness.
# Cells isolate the §5.2.2 dist/length regimes: non-overlap (dist >=
# length), partial overlap (dist < length), dist == 1 RLE fill, and a
# many-short-run fragmented stream.
[[bench]]
name = "backward_reference"
harness = false

# Round-300: encoder-side §5.2.2 `pixel_distance_to_distance_code` — the
# distance-code chooser run (at least) twice per emitted LZ77 backward
# reference. It linearly scans all 120 `DISTANCE_MAP` entries with no
# early-out, picking the smaller of the scan-line code `D + 120` and any
# distance-map code reconstructing to `D` for the image width. `lz77_match`
# / `lz77_chain` time the matcher that *finds* a run and `value_to_prefix`
# the per-symbol split; the distance→code mapping between them had no
# isolated harness. Four cells fix width 256 and vary distance: RLE
# (dist 1), the row-above match (dist == width, code 1), a close horizontal
# neighbour (dist 2), and a no-map-match large distance (full scan, scan-
# line fallback).
[[bench]]
name = "distance_code"
harness = false
