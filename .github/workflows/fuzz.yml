name: Fuzz

# Daily fuzz run for the cargo-fuzz harnesses under fuzz/. Splits the
# 30-minute total budget evenly across the discovered targets. Each
# harness is self-contained — it drives bytes straight into the
# crate's own parser entry points (`decode_webp`, `parse_vp8x_header`,
# `parse_alph_header` + `decode_alpha`, `parse_anmf_header` +
# `parse_anim_header`) and asserts the call returns rather than
# panicking / aborting / OOMing. No external dependencies pulled in.

on:
  schedule:
    - cron: "37 4 * * *"   # daily 04:37 UTC, jittered off the hour
  workflow_dispatch:

jobs:
  fuzz:
    uses: OxideAV/.github/.github/workflows/crate-fuzz.yml@master
    with:
      time_budget_seconds: 1800
    secrets: inherit
